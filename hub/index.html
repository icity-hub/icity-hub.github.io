<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICITY HUB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: one 440px phone column; city switcher drives every contact block below it */
:root{
  --bg:#F4F4FA;
  --surface:#FFFFFF;
  --surface-2:#EAEAF6;
  --ink:#12122B;
  --ink-2:#6B6B8C;
  --line:rgba(18,18,43,.08);
  --accent:#4F4DFF;
  --accent-2:#8B5CFF;
  --accent-ink:#FFFFFF;
  --hero:linear-gradient(160deg,#FFFFFF 0%,#EFEEFF 100%);
  --hero-ink:#12122B;
  --tint:rgba(79,77,255,.08);
  --tint-2:rgba(79,77,255,.14);
  --ok:#2F9E5B;
  --shadow:0 1px 0 rgba(18,18,43,.03),0 10px 28px -14px rgba(60,58,200,.28);
  color-scheme:light;
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:14px}
.label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

/* Header */
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-block:6px 4px}
.mark{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 1px 0 rgba(18,18,43,.04),0 16px 36px -14px rgba(79,77,255,.45)}
.mark img{display:block;width:100%;height:100%}
.brand{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.04em;line-height:1}
.tag{color:var(--ink-2);font-size:14px;line-height:1.5}
.tag b{color:var(--ink);font-weight:400;font-size:16px}



/* Hero store card */
.store{background:var(--hero);box-shadow:var(--shadow);border:1px solid var(--line);color:var(--hero-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.store::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(160,125,255,.28),transparent 70%);pointer-events:none}
.store::before{content:"";position:absolute;left:-80px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(79,77,255,.18),transparent 70%);pointer-events:none}
.store>*{position:relative;z-index:1}
.store-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--tint)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.status.open i{background:#4CC27E;box-shadow:0 0 0 4px rgba(76,194,126,.18)}
.city-name{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.03em;line-height:1.05}
.addr{font-size:15px;color:var(--ink-2);text-wrap:balance}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.store-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative;z-index:1}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;background:var(--tint);color:var(--accent);font-size:13px;font-weight:600;transition:background .2s}
.ghost:hover{background:var(--tint-2)}

/* Primary CTA buttons */
.btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s ease}
.btn:active{transform:scale(.985)}
.btn .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.btn .ic svg{width:20px;height:20px}
.btn .ic.ic-img{background:none!important;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.btn .ic-img img{width:40px;height:40px;display:block;border-radius:12px}
.btn .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.btn b{font-weight:600;font-size:15px;line-height:1.25}
.btn small{color:var(--ink-2);font-size:12.5px}
.btn .arr{color:var(--ink-2);flex:none}
.btn.main{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 14px 30px -14px rgba(79,77,255,.75)}
.btn.main .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.btn.main small,.btn.main .arr{color:inherit;opacity:.8}
.btn.main.tgblue{background:linear-gradient(120deg,#2AABEE,#229ED9);box-shadow:0 14px 30px -14px rgba(34,158,217,.8)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}

/* Perks */
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.perk{background:var(--surface-2);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.perk b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--accent);background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.perk span{font-size:11.5px;color:var(--ink-2);line-height:1.3}


.section-h{padding:10px 4px 0}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rv{display:flex;flex-direction:column;gap:2px;padding:14px 12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s ease}
.rv:active{transform:scale(.97)}
.rv b{font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.02em}
.rv span{font-size:12px;color:var(--ink-2)}
.rv::before{content:"★★★★★";font-size:10px;letter-spacing:1px;color:var(--accent);margin-bottom:4px}
.fine{font-size:10.5px;opacity:.7;line-height:1.4}
.foot{text-align:center;color:var(--ink-2);font-size:12.5px;padding-top:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.phone{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums;background:none;border:0;cursor:pointer;padding:4px 8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:10px 16px;border-radius:99px;transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Brand-colored buttons */
.btn[class*=" c-"]{color:#fff}
.btn[class*=" c-"] b{color:#fff}
.btn[class*=" c-"] small{color:rgba(255,255,255,.82)}
.btn[class*=" c-"] .arr{color:#fff;opacity:.85}
.btn[class*=" c-"] .ic:not(.ic-img){background:rgba(255,255,255,.2);color:#fff!important}
.btn[class*=" c-"] .ic-img{box-shadow:0 0 0 1px rgba(255,255,255,.28)}
.btn.c-tg{background:linear-gradient(120deg,#2AABEE,#229ED9);box-shadow:0 12px 26px -14px rgba(34,158,217,.8)}
.btn.c-call{background:linear-gradient(120deg,#34D058,#22B04A);box-shadow:0 12px 26px -14px rgba(34,176,74,.8)}
.btn.c-max{background:linear-gradient(135deg,#2F8BFF,#6B3DF0 55%,#9A3FE0);box-shadow:0 12px 26px -14px rgba(107,61,240,.8)}
.btn.c-cat{background:#4b48f6;box-shadow:0 12px 26px -14px rgba(75,72,246,.8)}
.btn.c-ti{background:linear-gradient(120deg,#2BC85A,#1FAE4A);box-shadow:0 12px 26px -14px rgba(31,174,74,.8)}
.btn.c-ig{background:linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF);box-shadow:0 12px 26px -14px rgba(221,42,123,.7)}
.btn.c-vk{background:#0077FF;box-shadow:0 12px 26px -14px rgba(0,119,255,.8)}
.btn.c-yt{background:#FF0033;box-shadow:0 12px 26px -14px rgba(255,0,51,.7)}
.btn.c-tt{background:#0B0B0F;box-shadow:0 12px 26px -14px rgba(0,0,0,.7)}
.btn.c-br{background:linear-gradient(120deg,#FFFFFF,#EAF0FF);box-shadow:0 0 0 1px rgba(79,77,255,.14),0 14px 30px -16px rgba(79,77,255,.45)}
.btn.c-br{flex-wrap:wrap;padding:18px 16px 16px;row-gap:14px}
.btn.c-br .apps-row{flex-basis:100%;display:grid;grid-template-columns:repeat(9,1fr);gap:5px;align-items:center;padding-top:14px;border-top:1px solid rgba(79,77,255,.12)}
.btn.c-br .apps-row img{width:100%;height:auto;aspect-ratio:1;border-radius:27%;display:block}
.btn.c-br .apps-row i{font-style:normal;font-weight:700;font-size:11px;color:#fff;background:linear-gradient(135deg,#14C561,#10A14F);border-radius:27%;aspect-ratio:1;display:grid;place-items:center}
.btn.c-br .cta{flex-basis:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;background:linear-gradient(120deg,#14C561,#10A14F);color:#fff;font-weight:600;font-size:15px;box-shadow:0 10px 22px -12px rgba(20,197,97,.85)}
.btn.c-br b{color:#12122B;font-size:15px;text-wrap:balance}
.btn.c-br small{color:#6B6B8C}
.btn.c-br .arr{color:#4F4DFF;opacity:1}
.btn.c-br .ic-img{box-shadow:0 0 0 1px rgba(18,18,43,.08)}
.btn.c-dz{background:#202022;box-shadow:0 12px 26px -14px rgba(0,0,0,.7)}
.rv.c-ya{background:#FC3F1D}.rv.c-2g{background:#1BA136}.rv.c-go{background:#4285F4}
.rv[class*=" c-"]{box-shadow:none}.rv[class*=" c-"] b{color:#fff}.rv[class*=" c-"] span{color:rgba(255,255,255,.82)}.rv[class*=" c-"]::before{color:#fff;opacity:.9}

/* compact restore plate */
.btn.c-br{padding:10px 12px 11px;row-gap:8px}
.btn.c-br .apps-row{grid-template-columns:repeat(9,24px);justify-content:space-between;padding-top:8px;gap:0}
.btn.c-br .apps-row i{font-size:9px;border-radius:7px}
.btn.c-br .apps-row img{border-radius:7px}
.btn.c-br .cta{height:32px;font-size:13.5px;border-radius:11px;gap:6px;box-shadow:0 6px 14px -9px rgba(20,197,97,.7)}
.btn.c-br .cta svg{width:15px;height:15px}
.btn.c-br .txt small{display:none}
.btn.c-br .apps-row{grid-template-columns:repeat(9,minmax(0,1fr));justify-content:stretch;gap:6px}
/* header like city pages */
.head{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:3px;align-items:center;text-align:left;padding:0}
.head>*{min-width:0}
.mark{width:60px;height:60px;grid-row:1/3;grid-column:1}
.mark img{width:100%;height:100%}
.brand{font-size:24px;grid-column:2;align-self:end}
.tag{grid-column:2;align-self:start;font-size:clamp(11px,3.15vw,12.5px);line-height:1.3;white-space:nowrap}
.tag b{font-weight:500;color:var(--ink-2);font-size:inherit}
@media(max-width:350px){.tag{white-space:normal;text-wrap:balance}}
</style>
